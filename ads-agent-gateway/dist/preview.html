<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>广告 Agent 管控网关 · 本地演示</title>
  <style>
:root {
  --bg: #f5f6fa;
  --card: #fff;
  --text: #1d2130;
  --muted: #6b7185;
  --line: #e4e6ee;
  --brand: #3b5bfd;
  --brand-soft: #eef1ff;
  --ok: #12a150;
  --ok-soft: #e7f7ee;
  --bad: #d93a3a;
  --bad-soft: #fdecec;
  --warn: #c77700;
  --warn-soft: #fff4e0;
  --side: #141826;
}
* { box-sizing: border-box; }
body {
  margin: 0; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  color: var(--text); background: var(--bg); display: flex; min-height: 100vh;
}
a { color: var(--brand); text-decoration: none; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: #f0f1f6; padding: 1px 5px; border-radius: 4px; }
pre { background: #141826; color: #d7dcf0; padding: 12px 14px; border-radius: 8px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; }
h1 { font-size: 24px; margin: 0 0 6px; }
h2 { font-size: 18px; margin: 36px 0 14px; }
h3 { font-size: 15px; margin: 0 0 6px; }
.muted, .sub { color: var(--muted); }
.sub { font-size: 12px; }

/* 侧边栏 */
.sidebar {
  width: 220px; flex-shrink: 0; background: var(--side); color: #c9cee0; padding: 20px 14px;
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
}
.brand { display: flex; gap: 10px; align-items: center; margin-bottom: 26px; padding: 0 6px; }
.brand-mark { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, #3b5bfd, #8a5cff); color: #fff; font-weight: 700; display: grid; place-items: center; }
.brand-name { color: #fff; font-weight: 600; font-size: 14px; line-height: 1.3; }
.brand-sub { font-size: 11px; color: #7d84a0; }
#nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: #c9cee0; margin-bottom: 2px; }
#nav a:hover { background: #1f2436; }
#nav a.active { background: #2a3150; color: #fff; }
.ni { width: 18px; text-align: center; opacity: .8; }
.nb { margin-left: auto; background: var(--warn); color: #fff; border-radius: 10px; font-size: 11px; padding: 0 7px; }
.reset { margin-top: auto; background: transparent; border: 1px solid #343a52; color: #9aa1bd; padding: 8px; border-radius: 8px; cursor: pointer; }
.reset:hover { color: #fff; border-color: #4b5373; }

main { flex: 1; padding: 32px 40px 80px; max-width: 1240px; min-width: 0; }

/* 通用组件 */
.btn { display: inline-block; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: #c5c9d8; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #2e4ce6; }
.btn.small { padding: 4px 12px; font-size: 13px; }
.btn.danger { color: var(--bad); border-color: #f0c4c4; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
.empty { color: var(--muted); text-align: center; padding: 28px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.badge { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.muted { background: #eef0f4; color: var(--muted); }
.pf { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 4px; color: #fff; vertical-align: 1px; }
.pf-meta { background: #1877f2; }
.pf-tiktok { background: #111; }
.callout { background: var(--brand-soft); border: 1px solid #d6ddff; border-radius: 10px; padding: 14px 16px; margin: 14px 0 6px; line-height: 1.8; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 0; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #141826; color: #fff; padding: 10px 18px; border-radius: 8px; opacity: 0; transition: .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 首页 */
.hero { background: linear-gradient(135deg, #1a2040 0%, #2b3a8f 60%, #5b45d6 100%); color: #fff; border-radius: 16px; padding: 40px 40px 36px; }
.hero h1 { font-size: 32px; margin: 10px 0 12px; }
.hero-tag { display: inline-block; font-size: 12px; background: rgba(255,255,255,.14); padding: 3px 10px; border-radius: 20px; }
.lead { font-size: 16px; max-width: 760px; color: #dfe3ff; margin: 0 0 22px; }
.lead b { color: #fff; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero .btn:not(.primary) { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.3); }
.hero .btn.primary { background: #fff; color: #2b3a8f; border-color: #fff; }
.stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-top: 18px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.stat-n { font-size: 24px; font-weight: 700; }
.stat-n small { font-size: 14px; color: var(--muted); font-weight: 400; }
.stat-l { font-size: 12px; color: var(--muted); }
.stat.ok .stat-n { color: var(--ok); }
.stat.bad .stat-n { color: var(--bad); }
.stat.warn .stat-n { color: var(--warn); }
.stat.money .stat-n { color: var(--brand); }
.needs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.need { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; }
.need-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.need-icon { font-size: 22px; }
.need-no { font-size: 11px; color: var(--muted); background: #f0f1f6; padding: 1px 8px; border-radius: 10px; }
.need p { margin: 6px 0; font-size: 13px; }
.need p b { display: block; font-size: 12px; margin-bottom: 2px; }
.pain b { color: var(--bad); }
.sol b { color: var(--ok); }
.need-link { margin-top: auto; padding-top: 8px; font-size: 13px; font-weight: 600; }
.arch { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
.arch-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.arch-col.core { flex: 1.4; background: var(--brand-soft); border: 1px solid #d6ddff; border-radius: 10px; padding: 14px; }
.arch-title { font-weight: 700; margin-bottom: 2px; }
.arch-box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; background: #fafbfd; }
.arch-box.dim { color: var(--muted); border-style: dashed; }
.arch-step { background: #fff; border-radius: 8px; padding: 7px 10px; font-size: 13px; }
.arch-step b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 11px; margin-right: 6px; }
.arch-arrow { color: var(--brand); font-weight: 700; white-space: nowrap; }
.arch-note { font-size: 12px; color: var(--muted); }
.scenarios { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 12px; }
.scenario { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.scenario p { margin: 4px 0 10px; font-size: 13px; color: #3c4256; }
.sc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.expect { font-size: 12px; color: var(--muted); }
.sc-result:not(:empty) { margin-top: 12px; }
.audience { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.aud { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
.aud p { margin: 0; font-size: 13px; color: #3c4256; }

/* 判定结果与检查链 */
.result { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: #fcfcfe; }
.result-head { display: flex; gap: 8px; align-items: center; font-weight: 600; margin-bottom: 8px; flex-wrap: wrap; }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; }
.checks li div { display: flex; flex-direction: column; }
.checks li span:not(.ck-icon) { color: var(--muted); font-size: 12px; }
.ck-icon { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 2px; }
.ck-pass .ck-icon { background: var(--ok-soft); color: var(--ok); }
.ck-fail .ck-icon { background: var(--bad); color: #fff; }
.ck-fail b { color: var(--bad); }
.ck-fail span:not(.ck-icon) { color: #a33 !important; }
.ck-review .ck-icon { background: var(--warn); color: #fff; }
.ck-review b { color: var(--warn); }
details { margin-top: 6px; }
summary { cursor: pointer; font-size: 12px; color: var(--brand); }

/* 模拟器 */
.sim { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 6px; }
select, textarea, input[type=text], input[type=number] {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; background: #fff; color: var(--text);
}
textarea { font: 13px/1.5 ui-monospace, Menlo, monospace; }
.sim .btn.primary { margin-top: 12px; }
.pickable { cursor: pointer; }
.pickable:hover td { background: var(--brand-soft); }

/* 表格 */
.tbl { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tbl th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfd; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl.compact td, .tbl.compact th { padding: 6px 10px; font-size: 13px; }
.tbl tr.rolled td { opacity: .5; }
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.role { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; }
.role-analyst { background: #eef0f4; color: #4a5068; }
.role-operator { background: #e6f0ff; color: #2357c6; }
.role-manager { background: #efe8ff; color: #6a3fd1; }
.role.none { color: #b3b7c6; }
.tag { display: inline-block; font-size: 11px; background: #f0f1f6; padding: 0 7px; border-radius: 4px; margin-right: 4px; }
.tag.protected { background: var(--warn-soft); color: var(--warn); }
.st { font-size: 12px; }
.st-ACTIVE { color: var(--ok); }
.st-PAUSED { color: var(--warn); }
.st-DELETED { color: var(--muted); text-decoration: line-through; }

/* 审批 */
.approval { display: flex; justify-content: space-between; align-items: center; gap: 16px; border-left: 4px solid var(--warn); }
.ap-title { font-weight: 600; font-size: 15px; }
.ap-meta { font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
.ap-reason { font-size: 13px; color: var(--warn); }
.ap-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* 规则 */
.policies { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 16px; }
.pol-head { margin-bottom: 10px; }
.bar { height: 6px; background: #eef0f4; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
.bar div { height: 100%; background: var(--brand); }
.bar div.hot { background: var(--warn); }
.pol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin: 6px 0 12px; }
.pol-grid label span { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.inp { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.inp em { font-style: normal; color: var(--muted); }
.checks-col { display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4px; }
.cb { font-weight: 400; display: flex; gap: 6px; align-items: center; margin: 4px 0; }

/* 账户 & MCP */
.account .tbl { margin-top: 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.tool { font: 12px ui-monospace, Menlo, monospace; padding: 2px 8px; border-radius: 6px; }
.tool.on { background: var(--ok-soft); color: var(--ok); }
.tool.off { background: #f3f4f7; color: #b3b7c6; text-decoration: line-through; }

@media (max-width: 1100px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
  .needs, .audience { grid-template-columns: 1fr 1fr; }
  .scenarios, .sim, .policies { grid-template-columns: 1fr; }
  .arch { flex-direction: column; align-items: stretch; }
  .arch-arrow { text-align: center; }
}
@media (max-width: 760px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; }
  main { padding: 20px; }
  .needs, .audience, .pol-grid { grid-template-columns: 1fr; }
}

</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AG</div>
      <div>
        <div class="brand-name">广告 Agent 管控网关</div>
        <div class="brand-sub">本地演示 · v0.1</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <button class="reset" id="reset">重置演示数据</button>
  </aside>
  <main id="app"></main>
  <div id="toast" class="toast"></div>
  <script>

window.STATIC_DEMO = true;

__defs["./store"] = function (module, exports, require) {
// 演示用的内存数据：品牌方、代理商、广告账户、授权关系、Agent、规则护栏。
// 所有公司、账户、人名均为虚构。

function createState() {
  const orgs = [
    { id: 'brand_aurora', name: '极光户外', type: 'brand' },
    { id: 'brand_stella', name: '星禾美妆', type: 'brand' },
    { id: 'agency_voyage', name: '远航出海代理', type: 'agency' },
  ];

  const accounts = [
    { id: 'act_meta_aurora_us', platform: 'meta', name: '极光户外 · Meta · 美国站', ownerOrg: 'brand_aurora' },
    { id: 'act_tt_aurora_us', platform: 'tiktok', name: '极光户外 · TikTok · 美国站', ownerOrg: 'brand_aurora' },

    { id: 'act_tt_stella_sea', platform: 'tiktok', name: '星禾美妆 · TikTok · 东南亚', ownerOrg: 'brand_stella' },

  const campaigns = [
    { id: 'cmp_1001', accountId: 'act_meta_aurora_us', name: '品牌词-搜索保护', tags: ['brand'], status: 'ACTIVE', dailyBudget: 800 },
    { id: 'cmp_1002', accountId: 'act_meta_aurora_us', name: '冲锋衣-再营销', tags: [], status: 'ACTIVE', dailyBudget: 1200 },
    { id: 'cmp_1003', accountId: 'act_meta_aurora_us', name: '帐篷-新客拓展', tags: [], status: 'ACTIVE', dailyBudget: 1500 },

    { id: 'cmp_3001', accountId: 'act_meta_stella_sea', name: '口红-新客', tags: [], status: 'ACTIVE', dailyBudget: 600 },
    { id: 'cmp_3002', accountId: 'act_meta_stella_sea', name: '品牌词', tags: ['brand'], status: 'ACTIVE', dailyBudget: 400 },
    { id: 'cmp_4001', accountId: 'act_tt_stella_sea', name: '粉底液-Spark Ads', tags: [], status: 'ACTIVE', dailyBudget: 700 },
  ];

  // 品牌方把自己的广告账户授权给代理商（类似 TikTok Business Center 的合作伙伴授权）

    { id: 'g4', accountId: 'act_tt_stella_sea', toOrg: 'agency_voyage', role: null }, // 未授权
  ];

  // 每个 Agent 是一个独立身份：所属组织、角色、被分配的账户、负责人、网关 token
  const agents = [

    },
    {
      id: 'agt_reporter', name: '数据日报 Agent', orgId: 'agency_voyage', role: 'analyst',

}

module.exports = { createState };

};

__defs["./gateway"] = function (module, exports, require) {

  },

    name: 'resume_campaign', title: '开启广告系列', minRole: 'operator', write: true,
    inputSchema: { type: 'object', properties: { campaign_id: { type: 'string' } }, required: ['campaign_id'] },
  },
  {
    name: 'create_campaign', title: '新建广告系列', minRole: 'manager', write: true,
    inputSchema: {
      type: 'object',
      properties: { account_id: { type: 'string' }, name: { type: 'string' }, daily_budget: { type: 'number' } },
      required: ['account_id', 'name', 'daily_budget'],
    },
  },
  {
    name: 'delete_campaign', title: '删除广告系列', minRole: 'manager', write: true,
    inputSchema: { type: 'object', properties: { campaign_id: { type: 'string' } }, required: ['campaign_id'] },
  },
];

const usd = (n) => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });

class Gateway {
  constructor(state) {
    this.state = state;
  }

  find(list, id) {
    return this.state[list].find((x) => x.id === id);
  }

  orgName(id) {
    return this.find('orgs', id)?.name || id;
  }

  // 有效权限 = Agent 自身角色 ∩ 品牌方授予其所属组织的角色（自家账户则不受授权限制）
  effectiveRole(agent, account) {
    if (agent.orgId === account.ownerOrg) return { role: agent.role, via: 'owner' };
    const grant = this.state.grants.find((g) => g.accountId === account.id && g.toOrg === agent.orgId);
    if (!grant || !grant.role) return { role: null, via: 'none' };
    const role = ROLE_RANK[grant.role] < ROLE_RANK[agent.role] ? grant.role : agent.role;
    return { role, via: 'grant', grantRole: grant.role };
  }

  // tools/list 只返回 Agent 在任一账户上有权使用的工具
  visibleTools(agent) {
    if (!agent || agent.status !== 'active') return [];
    let max = 0;
    for (const accId of agent.accounts) {
      const acc = this.find('accounts', accId);
      const eff = acc && this.effectiveRole(agent, acc);
      if (eff?.role) max = Math.max(max, ROLE_RANK[eff.role]);
    }
    return TOOLS.filter((t) => ROLE_RANK[t.minRole] <= max);
  }

  activeBudgetSum(accountId) {
    return this.state.campaigns
      .filter((c) => c.accountId === accountId && c.status === 'ACTIVE')
      .reduce((s, c) => s + c.dailyBudget, 0);
  }

  describe(tool, args) {
    const c = args.campaign_id && this.find('campaigns', args.campaign_id);
    const a = args.account_id && this.find('accounts', args.account_id);
    const cn = c ? `「${c.name}」` : `「${args.campaign_id}」`;
    const an = a ? `「${a.name}」` : `「${args.account_id}」`;
    switch (tool) {
      case 'list_accounts': return '列出可访问的广告账户';
      case 'list_campaigns': return `查看${an}的广告系列`;
      case 'get_report': return `查看${an}的今日报表`;
      case 'update_budget': return `将${cn}日预算 ${c ? usd(c.dailyBudget) : '?'} → ${usd(args.daily_budget)}`;
      case 'pause_campaign': return `暂停${cn}`;
      case 'resume_campaign': return `开启${cn}`;
      case 'create_campaign': return `在${an}新建广告系列「${args.name}」，日预算 ${usd(args.daily_budget)}`;
      case 'delete_campaign': return `删除${cn}`;
      default: return `${tool} ${JSON.stringify(args)}`;
    }
  }

  handle({ token, tool, args = {}, via = 'console' }) {
    const st = this.state;
    const checks = [];
    const ctx = { savedUsd: 0 };
    const description = this.describe(tool, args);
    const agent = st.agents.find((a) => a.token === token);
    let account = null;

    const pass = (name, detail) => checks.push({ name, status: 'pass', detail });
    const review = (name, detail) => checks.push({ name, status: 'review', detail });
    const fail = (name, detail) => {
      checks.push({ name, status: 'fail', detail });
      return this.record({ agent, tool, args, via, checks, decision: 'denied', account, description, savedUsd: ctx.savedUsd });
    };

    // 1. 身份
    if (!agent) return fail('身份认证', 'token 无效，请求被拒绝');
    if (agent.status !== 'active') return fail('身份认证', `${agent.name} 已被停用（Kill Switch）`);
    pass('身份认证', `${agent.name} · ${this.orgName(agent.orgId)} · 负责人 ${agent.sponsor}`);

    const def = TOOLS.find((t) => t.name === tool);
    if (!def) return fail('工具识别', `未知工具 ${tool}`);

    // 2. 定位目标对象
    let campaign = null;
    if (args.campaign_id) {
      campaign = this.find('campaigns', args.campaign_id);
      if (!campaign) return fail('目标对象', `广告系列 ${args.campaign_id} 不存在`);
      account = this.find('accounts', campaign.accountId);
    } else if (args.account_id) {
      account = this.find('accounts', args.account_id);
      if (!account) return fail('目标对象', `广告账户 ${args.account_id} 不存在`);
    } else if (tool !== 'list_accounts') {
      return fail('参数校验', '缺少 account_id 或 campaign_id');
    }

    // 3. 资产范围 + 操作权限
    if (account) {
      if (!agent.accounts.includes(account.id)) {
        return fail('资产范围', `该 Agent 未被分配账户「${account.name}」`);
      }
      const eff = this.effectiveRole(agent, account);
      if (!eff.role) {
        return fail('资产范围', `「${this.orgName(agent.orgId)}」未获得品牌方「${this.orgName(account.ownerOrg)}」对「${account.name}」的授权`);
      }
      pass('资产范围', eff.via === 'owner'
        ? `自有账户「${account.name}」`
        : `品牌方「${this.orgName(account.ownerOrg)}」已授权「${this.orgName(agent.orgId)}」：${ROLE_LABEL[eff.grantRole]}`);

      if (ROLE_RANK[eff.role] < ROLE_RANK[def.minRole]) {
        const why = eff.via === 'grant' && ROLE_RANK[eff.grantRole] < ROLE_RANK[agent.role]
          ? `（Agent 角色是「${ROLE_LABEL[agent.role]}」，但品牌方只授予了「${ROLE_LABEL[eff.grantRole]}」）`
          : '';
        return fail('操作权限', `有效角色「${ROLE_LABEL[eff.role]}」不能执行「${def.title}」，需要「${ROLE_LABEL[def.minRole]}」${why}`);
      }
      pass('操作权限', `有效角色「${ROLE_LABEL[eff.role]}」可执行「${def.title}」`);
    } else {
      pass('操作权限', '只读操作');
    }

    if (!def.write) {
      const result = this.executeRead(agent, tool, account);
      return this.record({ agent, tool, args, via, checks, decision: 'allowed', account, description, result });
    }

    // 4. 广告护栏
    const p = st.policies[account.id];
    if (campaign) {
      if (campaign.status === 'DELETED') return fail('目标对象', `「${campaign.name}」已删除`);
      const hit = campaign.tags.filter((t) => p.protectedTags.includes(t));
      if (hit.length) return fail('受保护对象', `「${campaign.name}」带有受保护标签 [${hit.join(', ')}]，禁止 Agent 修改`);
      pass('受保护对象', '目标不在保护名单内');
    }

    if (tool === 'delete_campaign' && p.forbidDelete) {
      return fail('禁止删除', '账户策略禁止 Agent 删除广告系列（误删无法恢复），请改用暂停');
    }

    const hourAgo = Date.now() - 3600e3;
    const recent = st.audit.filter((e) => e.agentId === agent.id && e.write && e.ts > hourAgo
      && ['allowed', 'pending', 'approved'].includes(e.decision)).length;
    if (recent >= p.maxChangesPerHour) {
      return fail('频率限制', `近 1 小时已变更 ${recent} 次，达到上限 ${p.maxChangesPerHour} 次`);
    }
    pass('频率限制', `近 1 小时变更 ${recent}/${p.maxChangesPerHour} 次`);

    const approvalReasons = [];
    let newBudget = 0;
    if (tool === 'update_budget' || tool === 'create_campaign') {
      newBudget = Number(args.daily_budget);
      if (!(newBudget > 0)) return fail('参数校验', 'daily_budget 必须是正数');
    }
    if (tool === 'create_campaign' && !args.name) return fail('参数校验', '缺少广告系列名称');

    if (tool === 'update_budget') {
      const old = campaign.dailyBudget;
      if (newBudget > old) {
        const pct = ((newBudget - old) / old) * 100;
        if (pct > p.maxIncreasePct) {
          ctx.savedUsd = newBudget - old;
          return fail('单次涨幅', `${usd(old)} → ${usd(newBudget)}，涨幅 ${pct.toFixed(0)}%，超过上限 ${p.maxIncreasePct}%（疑似误操作）`);
        }
        pass('单次涨幅', `涨幅 ${pct.toFixed(1)}%，上限 ${p.maxIncreasePct}%`);
        if (newBudget - old > p.approvalAboveUsd) {
          approvalReasons.push(`单次加预算 ${usd(newBudget - old)}，超过审批阈值 ${usd(p.approvalAboveUsd)}`);
        }
      } else {
        pass('单次涨幅', '降低或不变预算，无需限制');
      }
    }

    if (['update_budget', 'create_campaign', 'resume_campaign'].includes(tool)) {
      const current = this.activeBudgetSum(account.id);
      let projected = current;
      if (tool === 'update_budget' && campaign.status === 'ACTIVE') projected = current - campaign.dailyBudget + newBudget;
      if (tool === 'create_campaign') projected = current + newBudget;
      if (tool === 'resume_campaign' && campaign.status !== 'ACTIVE') projected = current + campaign.dailyBudget;
      if (projected > p.accountDailyCap) {
        ctx.savedUsd = projected - current;
        return fail('账户日预算上限', `执行后账户活跃日预算合计 ${usd(projected)}，超过上限 ${usd(p.accountDailyCap)}`);
      }
      pass('账户日预算上限', `执行后合计 ${usd(projected)} / 上限 ${usd(p.accountDailyCap)}`);
    }

    if (tool === 'create_campaign' && p.requireApprovalForCreate) approvalReasons.push('账户策略要求新建广告系列需人工审批');

    // 5. 审批
    if (approvalReasons.length) {
      review('人工审批', approvalReasons.join('；'));
      const entry = this.record({ agent, tool, args, via, checks, decision: 'pending', account, description });
      const approval = {
        id: ++st.seq.approval, auditId: entry.id, ts: Date.now(), agentId: agent.id, agentName: agent.name,
        tool, args, description, reason: approvalReasons.join('；'), accountId: account.id, status: 'pending',
      };
      st.approvals.unshift(approval);
      entry.approvalId = approval.id;
      return entry;
    }
    pass('人工审批', '未触发审批条件，自动放行');

    const change = this.executeWrite(tool, args, campaign, account);
    return this.record({ agent, tool, args, via, checks, decision: 'allowed', account, description, ...change });
  }

  executeRead(agent, tool, account) {
    if (tool === 'list_accounts') {
      return this.state.accounts
        .filter((a) => agent.accounts.includes(a.id))
        .map((a) => ({ id: a.id, name: a.name, platform: a.platform, role: this.effectiveRole(agent, a).role }))
        .filter((a) => a.role);
    }
    const cs = this.state.campaigns.filter((c) => c.accountId === account.id && c.status !== 'DELETED');
    if (tool === 'list_campaigns') {
      return cs.map((c) => ({ id: c.id, name: c.name, status: c.status, daily_budget: c.dailyBudget, tags: c.tags }));
    }
    if (tool === 'get_report') {
      return cs.map((c) => {
        const seed = [...c.id].reduce((s, ch) => s + ch.charCodeAt(0), 0);
        const spend = c.status === 'ACTIVE' ? Math.round(c.dailyBudget * (0.35 + (seed % 40) / 100)) : 0;
        return { id: c.id, name: c.name, spend_today: spend, roas: +(1.2 + (seed % 25) / 10).toFixed(2) };
      });
    }
    return null;
  }

  executeWrite(tool, args, campaign, account) {
    const snap = (c) => (c ? { status: c.status, dailyBudget: c.dailyBudget } : null);
    if (tool === 'create_campaign') {
      const c = {
        id: 'cmp_' + ++this.state.seq.campaign, accountId: account.id, name: args.name,
        tags: [], status: 'ACTIVE', dailyBudget: Number(args.daily_budget),
      };
      this.state.campaigns.push(c);
      return { before: null, after: snap(c), targetId: c.id, result: { created: c.id } };
    }
    const before = snap(campaign);
    if (tool === 'update_budget') campaign.dailyBudget = Number(args.daily_budget);
    if (tool === 'pause_campaign') campaign.status = 'PAUSED';
    if (tool === 'resume_campaign') campaign.status = 'ACTIVE';
    if (tool === 'delete_campaign') campaign.status = 'DELETED';
    return { before, after: snap(campaign), targetId: campaign.id, result: { id: campaign.id, ...snap(campaign) } };
  }

  record({ agent, tool, args, via, checks, decision, account, description, result, before, after, targetId, savedUsd }) {
    const st = this.state;
    const entry = {
      id: ++st.seq.audit, ts: Date.now(), via,
      agentId: agent?.id || null, agentName: agent?.name || '未知调用方',
      orgName: agent ? this.orgName(agent.orgId) : '-',
      tool, args, write: !!TOOLS.find((t) => t.name === tool)?.write,
      accountId: account?.id || null, platform: account?.platform || null,
      description, decision, checks, result: result ?? null,
      before: before ?? null, after: after ?? null, targetId: targetId ?? null,
      savedUsd: savedUsd || 0, rolledBack: false,
    };
    st.audit.unshift(entry);
    if (st.audit.length > 500) st.audit.length = 500;
    return entry;
  }

  decideApproval(id, approve, by = '王敏（投放主管）') {
    const st = this.state;
    const ap = st.approvals.find((a) => a.id === id);
    if (!ap || ap.status !== 'pending') throw new Error('审批单不存在或已处理');
    const entry = st.audit.find((e) => e.id === ap.auditId);
    ap.status = approve ? 'approved' : 'rejected';
    ap.decidedBy = by;
    ap.decidedAt = Date.now();
    if (!approve) {
      if (entry) {
        entry.decision = 'rejected';
        entry.checks.push({ name: '人工审批', status: 'fail', detail: `${by} 已驳回` });
      }
      return ap;
    }
    const campaign = ap.args.campaign_id && this.find('campaigns', ap.args.campaign_id);
    const account = this.find('accounts', ap.accountId);
    const change = this.executeWrite(ap.tool, ap.args, campaign, account);
    if (entry) {
      Object.assign(entry, change, { decision: 'approved' });
      entry.checks.push({ name: '人工审批', status: 'pass', detail: `${by} 已批准，网关已执行` });
    }
    return ap;
  }

  rollback(auditId, by = '王敏（投放主管）') {
    const st = this.state;
    const e = st.audit.find((x) => x.id === auditId);
    if (!e || !e.after || e.rolledBack) throw new Error('该记录无法回滚');
    const c = this.find('campaigns', e.targetId);
    if (!c) throw new Error('目标广告系列不存在');
    if (e.before) Object.assign(c, e.before);
    else c.status = 'DELETED'; // 回滚新建 = 下线该广告系列
    e.rolledBack = true;
    st.audit.unshift({
      id: ++st.seq.audit, ts: Date.now(), via: 'console', agentId: null, agentName: by, orgName: '人工操作',
      tool: 'rollback', args: { audit_id: auditId }, write: false, accountId: e.accountId, platform: e.platform,
      description: `回滚 #${auditId}：${e.description}`, decision: 'allowed', checks: [], result: null,
      before: null, after: null, targetId: c.id, savedUsd: 0, rolledBack: false,
    });
  }

  stats() {
    const a = this.state.audit.filter((e) => e.tool !== 'rollback');
    const count = (...d) => a.filter((e) => d.includes(e.decision)).length;
    return {
      total: a.length,
      allowed: count('allowed', 'approved'),
      denied: count('denied'),
      pending: this.state.approvals.filter((x) => x.status === 'pending').length,
      savedUsd: a.reduce((s, e) => s + (e.savedUsd || 0), 0),
      activeAgents: this.state.agents.filter((x) => x.status === 'active').length,
      accounts: this.state.accounts.length,
    };
  }
}

module.exports = { Gateway, TOOLS, ROLE_RANK, ROLE_LABEL };

};

async function api(path, opts = {}) {
  const res = await fetch(path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '请求失败');
  return data;
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function refresh() {
  S = await api('/api/state');
}

function renderChecks(checks) {
  const icon = { pass: '✓', fail: '✕', review: '⏸' };
  return `<ol class="checks">${checks.map((c) => `
    <li class="ck-${c.status}"><span class="ck-icon">${icon[c.status]}</span>
      <div><b>${esc(c.name)}</b><span>${esc(c.detail)}</span></div></li>`).join('')}</ol>`;
}

function renderResult(e) {
  if (!e) return '';
  return `
    <div class="result">
      <div class="result-head">${badge(e.decision)}<span>${esc(e.description)}</span></div>
      ${renderChecks(e.checks)}
      ${e.decision === 'pending' ? `<div class="hint">已生成审批单 #${e.approvalId}，到 <a href="#approvals">审批中心</a> 处理。</div>` : ''}
      ${e.result ? `<details><summary>返回给 Agent 的数据</summary><pre>${esc(JSON.stringify(e.result, null, 2))}</pre></details>` : ''}
    </div>`;
}

function mountSimulator() {
  const agentSel = $('#sim-agent');
  const toolSel = $('#sim-tool');
  const updateHint = () => {
    const vis = S.effective.find((e) => e.agentId === agentSel.value)?.visibleTools || [];
    const ok = vis.includes(toolSel.value);
    $('#sim-visibility').innerHTML = ok
      ? '✓ 该工具出现在此 Agent 的 MCP 工具列表中'
      : '⚠ 该 Agent 的 MCP 工具列表里<b>看不到</b>这个工具；这里强行调用，用来演示网关在调用时的二次校验';
  };
  toolSel.onchange = () => {
    $('#sim-args').value = JSON.stringify(ARG_TEMPLATES[toolSel.value], null, 2);
    updateHint();
  };
  agentSel.onchange = updateHint;
  updateHint();
  document.querySelectorAll('[data-cid]').forEach((tr) => {
    tr.onclick = () => {
      let args = {};
      try { args = JSON.parse($('#sim-args').value || '{}'); } catch (e) { /* 覆盖无效 JSON */ }
      delete args.account_id;
      args.campaign_id = tr.dataset.cid;
      $('#sim-args').value = JSON.stringify(args, null, 2);
    };
  });
  $('#sim-run').onclick = async () => {
    let args;
    try { args = JSON.parse($('#sim-args').value || '{}'); } catch (e) { return toast('参数不是合法 JSON'); }
    simResult = await api('/api/simulate', { method: 'POST', body: { agentId: agentSel.value, tool: toolSel.value, args } });
    await refresh();
    $('#sim-result').innerHTML = renderResult(simResult);
    renderNav();
  };
}

      </td>
      <td>${e.tool === 'rollback' ? '<span class="badge muted">人工回滚</span>' : badge(e.decision)}${e.rolledBack ? '<div class="sub">已回滚</div>' : ''}</td>
      <td>${e.after && !e.rolledBack ? `<button class="btn small" data-rollback="${e.id}">回滚</button>` : ''}</td>
    </tr>`).join('')}
  </tbody></table>` : '<div class="empty card">还没有记录。去首页运行几个场景试试。</div>'}`;
}

// ---------- 页面：组织与授权 ----------
function pageAccess() {
  const roleOpts = (cur) => [['', '未授权'], ['analyst', S.roleLabels.analyst], ['operator', S.roleLabels.operator], ['manager', S.roleLabels.manager]]
    .map(([v, l]) => `<option value="${v}" ${(cur || '') === v ? 'selected' : ''}>${l}</option>`).join('');
  const cell = (r) => (r ? `<span class="role role-${r}">${S.roleLabels[r]}</span>` : '<span class="role none">—</span>');
  return `
  <h1>组织与授权</h1>
  <div class="callout">
    <b>和 TikTok Business Center 一样的思路：</b>品牌方拥有广告账户 → 按角色授权给代理商 → 代理商把账户分配给自己的 Agent。<br/>
    <b>Agent 的有效权限 = Agent 自身角色 ∩ 品牌方授予代理商的角色</b>，品牌方调低或收回授权，所有相关 Agent 立即生效。
  </div>

  <h2>资产授权（品牌方 → 代理商）</h2>
  <table class="tbl"><thead><tr><th>广告账户</th><th>品牌方</th><th>授权给</th><th>授予角色</th></tr></thead><tbody>
    ${S.grants.map((g) => {
      const acc = S.accounts.find((a) => a.id === g.accountId);
      return `<tr><td>${platformTag(acc.platform)} ${esc(acc.name)}</td><td>${esc(orgName(acc.ownerOrg))}</td><td>${esc(orgName(g.toOrg))}</td>
        <td><select data-grant="${g.id}">${roleOpts(g.role)}</select></td></tr>`;
    }).join('')}
  </tbody></table>

  <h2>Agent 身份</h2>
  <table class="tbl"><thead><tr><th>Agent</th><th>所属组织</th><th>角色</th><th>被分配账户</th><th>负责人</th><th>状态</th><th></th></tr></thead><tbody>
    ${S.agents.map((a) => `<tr class="${a.status !== 'active' ? 'rolled' : ''}">
      <td><b>${esc(a.name)}</b><div class="sub"><code>${a.id}</code></div></td>
      <td>${esc(orgName(a.orgId))}</td><td>${cell(a.role)}</td>
      <td>${a.accounts.map((id) => `<div class="sub">${esc(accName(id))}</div>`).join('')}</td>
      <td>${esc(a.sponsor)}</td>
      <td>${a.status === 'active' ? '<span class="badge ok">在线</span>' : '<span class="badge bad">已停用</span>'}</td>
      <td><button class="btn small ${a.status === 'active' ? 'danger' : ''}" data-toggle="${a.id}">${a.status === 'active' ? '一键停用' : '恢复'}</button></td>
    </tr>`).join('')}
  </tbody></table>

  <h2>有效权限矩阵</h2>
  <p class="muted">实时计算的结果。试着把上面「星禾美妆 · Meta」的授权从只读改成优化师，再看这里的变化。</p>
  <table class="tbl matrix"><thead><tr><th>Agent \\ 账户</th>${S.accounts.map((a) => `<th>${platformTag(a.platform)}<div>${esc(a.name.split(' · ')[0])}</div></th>`).join('')}</tr></thead><tbody>
    ${S.effective.map((e) => `<tr><td><b>${esc(agentById(e.agentId).name)}</b></td>${S.accounts.map((a) => `<td>${cell(e.byAccount[a.id])}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}

// ---------- 页面：规则护栏 ----------
function pagePolicies() {
  return `
  <h1>规则护栏</h1>
  <p class="muted">按广告账户配置。这些规则理解广告业务本身（预算、涨幅、品牌词），而不仅仅是「能不能调用某个工具」。修改后立即对所有 Agent 生效。</p>
  <div class="policies">
  ${S.accounts.map((acc) => {
    const p = S.policies[acc.id];
    const used = S.activeBudget[acc.id];
    const pct = Math.min(100, (used / p.accountDailyCap) * 100);
    return `
    <div class="card policy" data-acc="${acc.id}">
      <div class="pol-head">${platformTag(acc.platform)} <b>${esc(acc.name)}</b></div>
      <div class="bar"><div style="width:${pct}%" class="${pct > 85 ? 'hot' : ''}"></div></div>
      <div class="sub">当前活跃日预算 ${usd(used)} / 上限 ${usd(p.accountDailyCap)}</div>
      <div class="pol-grid">
        <label>单次加预算涨幅上限 <span>超过直接拦截</span><div class="inp"><input type="number" name="maxIncreasePct" value="${p.maxIncreasePct}"/><em>%</em></div></label>
        <label>审批阈值 <span>单次加预算超过此金额需审批</span><div class="inp"><em>$</em><input type="number" name="approvalAboveUsd" value="${p.approvalAboveUsd}"/></div></label>
        <label>账户日预算总上限 <span>所有投放中广告系列合计</span><div class="inp"><em>$</em><input type="number" name="accountDailyCap" value="${p.accountDailyCap}"/></div></label>
        <label>每小时变更次数上限 <span>每个 Agent</span><div class="inp"><input type="number" name="maxChangesPerHour" value="${p.maxChangesPerHour}"/><em>次</em></div></label>
        <label>受保护标签 <span>带这些标签的广告系列禁止 Agent 修改</span><div class="inp"><input type="text" name="protectedTags" value="${esc(p.protectedTags.join(', '))}"/></div></label>
        <div class="checks-col">
          <label class="cb"><input type="checkbox" name="forbidDelete" ${p.forbidDelete ? 'checked' : ''}/> 禁止 Agent 删除广告系列</label>
          <label class="cb"><input type="checkbox" name="requireApprovalForCreate" ${p.requireApprovalForCreate ? 'checked' : ''}/> 新建广告系列需审批</label>
        </div>
      </div>
      <button class="btn primary small" data-save="${acc.id}">保存</button>
    </div>`;
  }).join('')}
  </div>`;
}

// ---------- 页面：广告账户 ----------
function pageAccounts() {
  return `
  <h1>广告账户</h1>
  <p class="muted">模拟的 Meta / TikTok 广告账户实时状态。Agent 通过网关做的变更、审批执行和回滚都会反映在这里。</p>
  ${S.accounts.map((acc) => {
    const p = S.policies[acc.id];
    const used = S.activeBudget[acc.id];
    const pct = Math.min(100, (used / p.accountDailyCap) * 100);
    const cs = S.campaigns.filter((c) => c.accountId === acc.id);
    return `
    <div class="card account">
      <div class="row-between">
        <div>${platformTag(acc.platform)} <b>${esc(acc.name)}</b> <span class="sub">品牌方：${esc(orgName(acc.ownerOrg))} · <code>${acc.id}</code></span></div>
        <div class="sub">活跃日预算 ${usd(used)} / ${usd(p.accountDailyCap)}</div>
      </div>
      <div class="bar"><div style="width:${pct}%" class="${pct > 85 ? 'hot' : ''}"></div></div>
      <table class="tbl compact"><thead><tr><th>广告系列</th><th>ID</th><th>标签</th><th>状态</th><th>日预算</th></tr></thead><tbody>
        ${cs.map((c) => `<tr class="${c.status === 'DELETED' ? 'rolled' : ''}"><td>${esc(c.name)}</td><td><code>${c.id}</code></td>
          <td>${c.tags.map((t) => `<span class="tag ${p.protectedTags.includes(t) ? 'protected' : ''}">${esc(t)}${p.protectedTags.includes(t) ? ' 🔒' : ''}</span>`).join('')}</td>
          <td><span class="st st-${c.status}">${STATUS[c.status]}</span></td><td>${usd(c.dailyBudget)}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
  }).join('')}`;
}

// ---------- 页面：MCP 接入 ----------
function pageMcp() {
  const origin = window.STATIC_DEMO ? 'http://localhost:8787' : location.origin;
  return `
  <h1>MCP 接入</h1>
  <div class="callout">
    所有 Agent 统一连接 <code>${origin}/mcp</code>，每个 Agent 用自己的身份 token。<br/>
    Agent <b>拿不到</b>任何广告平台凭证；调用 <code>tools/list</code> 时只会看到自己有权使用的工具，调用时网关还会再校验一次。
  </div>
  ${S.agents.map((a) => {
    const vis = S.effective.find((e) => e.agentId === a.id).visibleTools;
    return `
    <div class="card mcp">
      <div class="row-between"><div><b>${esc(a.name)}</b> <span class="sub">${esc(orgName(a.orgId))} · ${esc(S.roleLabels[a.role])}</span></div>
        ${a.status === 'active' ? '<span class="badge ok">在线</span>' : '<span class="badge bad">已停用</span>'}</div>
      <div class="sub">网关 token：<code>${a.token}</code></div>
      <div class="tools">${S.tools.map((t) => `<span class="tool ${vis.includes(t.name) ? 'on' : 'off'}">${t.name}</span>`).join('')}</div>
      <details><summary>接入 Claude Code</summary>
        <pre>claude mcp add --transport http ads-gateway ${origin}/mcp \\
  --header "Authorization: Bearer ${a.token}"</pre></details>
      <details><summary>用 curl 查看它能看到的工具</summary>
        <pre>curl -s ${origin}/mcp \\
  -H "Authorization: Bearer ${a.token}" \\
  -H "Content-Type: application/json" \\
  -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'</pre></details>
    </div>`;
  }).join('')}`;
}

// ---------- 路由与事件 ----------
const PAGES = {
  home: [pageHome], simulator: [pageSimulator, mountSimulator], approvals: [pageApprovals], audit: [pageAudit],
  access: [pageAccess], policies: [pagePolicies], accounts: [pageAccounts], mcp: [pageMcp],
};

function renderNav() {
  const r = route();
  const pending = S.stats.pending;
  $('#nav').innerHTML = NAV.map((n) => `
    <a href="#${n.path}" class="${r === n.path ? 'active' : ''}"><span class="ni">${n.icon}</span>${n.label}
      ${n.path === 'approvals' && pending ? `<span class="nb">${pending}</span>` : ''}</a>`).join('');
}

function render() {
  const [page, mount] = PAGES[route()] || PAGES.home;
  renderNav();
  $('#app').innerHTML = page();
  if (mount) mount();
}

document.addEventListener('click', async (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  try {
    if (t.dataset.run) {
      await runScenario(t.dataset.run);
    } else if (t.id === 'run-all') {
      for (const sc of SCENARIOS) await runScenario(sc.key);
      toast('10 个场景已全部运行');
    } else if (t.dataset.approve) {
      await api(`/api/approvals/${t.dataset.approve}/approve`, { method: 'POST' });
      toast('已批准，网关已执行变更');
    } else if (t.dataset.reject) {
      await api(`/api/approvals/${t.dataset.reject}/reject`, { method: 'POST' });
      toast('已驳回');
    } else if (t.dataset.rollback) {
      await api(`/api/audit/${t.dataset.rollback}/rollback`, { method: 'POST' });
      toast('已回滚到变更前状态');
    } else if (t.dataset.toggle) {
      const a = await api(`/api/agents/${t.dataset.toggle}/toggle`, { method: 'POST' });
      toast(a.status === 'active' ? `${a.name} 已恢复` : `${a.name} 已停用，所有调用将被拒绝`);
    } else if (t.dataset.save) {
      const card = t.closest('.policy');
      const v = (n) => card.querySelector(`[name=${n}]`);
      await api(`/api/policies/${t.dataset.save}`, {
        method: 'PUT',
        body: {
          maxIncreasePct: v('maxIncreasePct').value, approvalAboveUsd: v('approvalAboveUsd').value,
          accountDailyCap: v('accountDailyCap').value, maxChangesPerHour: v('maxChangesPerHour').value,
          protectedTags: v('protectedTags').value.split(/[,，\s]+/).filter(Boolean),
          forbidDelete: v('forbidDelete').checked, requireApprovalForCreate: v('requireApprovalForCreate').checked,
        },
      });
      toast('规则已保存，立即生效');
    } else if (t.id === 'reset') {
      await api('/api/reset', { method: 'POST' });
      Object.keys(scenarioResults).forEach((k) => delete scenarioResults[k]);
      simResult = null;
      toast('演示数据已重置');
    } else {
      return;
    }
    await refresh();
    render();
  } catch (e) {
    toast(e.message);
  }
});

document.addEventListener('change', async (ev) => {
  const t = ev.target;
  if (t.dataset.grant) {
    await api(`/api/grants/${t.dataset.grant}`, { method: 'PUT', body: { role: t.value || null } });
    toast('授权已更新，相关 Agent 立即生效');
  } else if (t.id === 'audit-filter') {
    auditFilter = t.value;
  } else {
    return;
  }
  await refresh();
  render();
});

window.addEventListener('hashchange', () => {
  render();
  window.scrollTo(0, 0);
});

// 定时刷新，以便看到外部 Agent 通过 MCP 发起的调用
setInterval(async () => {
  const typing = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if (typing) return;
  const before = S && S.audit.length + S.stats.pending;
  await refresh();
  if (S.audit.length + S.stats.pending !== before) {
    if (['home', 'audit', 'approvals', 'accounts'].includes(route())) render();
    else renderNav();
  }
}, 3000);

refresh().then(render);

</script>
